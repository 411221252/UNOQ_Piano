<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3ef"><title>UNO Q Piano｜迷你鋼琴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header><div class="brand-mark">♬</div><div><p class="eyebrow">UNO Q · MUSIC LAB</p><h1>迷你鋼琴</h1></div><span class="chip">🎹 兩個八度</span></header>
    <section class="intro"><div><p class="eyebrow">PLAY A LITTLE MUSIC</p><h2>讓指尖開始作曲。</h2><p>點琴鍵聽音符，也可以用鍵盤 <kbd>A</kbd> 到 <kbd>J</kbd> 演奏。</p></div><div class="music-note">♪</div></section>
    <section class="panel piano-panel">
      <div class="section-heading"><div><span class="step">01</span><h3>彈奏琴鍵</h3></div><span class="hint">點擊琴鍵或使用電腦鍵盤</span></div>
      <div id="keyboard" class="keyboard" aria-label="鋼琴鍵盤"></div>
      <div class="key-legend"><span><i class="legend-white"></i>白鍵</span><span><i class="legend-black"></i>黑鍵</span><span class="legend-tip">電腦鍵盤對照標示於琴鍵上</span></div>
    </section>
    <section class="panel recorder-panel">
      <div class="section-heading"><div><span class="step">02</span><h3>錄下你的旋律</h3></div><span class="limit">最長 <strong>10 秒</strong></span></div>
      <div class="recorder-body">
        <button id="recordBtn" class="record-button"><span class="record-dot"></span><span id="recordLabel">開始錄音</span></button>
        <div class="meter-wrap"><div class="meter-top"><span id="status">準備好了，開始演奏吧</span><span id="timer">00:00 / 00:10</span></div><div class="meter"><div id="progress"></div></div></div>
      </div>
      <div class="actions"><button id="playBtn" class="button primary" disabled>▶　播放錄音</button><button id="saveBtn" class="button" disabled>↓　儲存錄音</button><button id="loadBtn" class="button">↑　載入錄音</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div>
      <p class="note">錄音會保存在此瀏覽器。選「儲存錄音」可下載旋律檔，之後也能載入播放。</p>
    </section>
    <footer><span>MADE FOR ARDUINO UNO Q</span><span id="savedState">你的旋律，只屬於你。</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
